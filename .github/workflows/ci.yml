name: ci

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t mono-roslyn .

      - name: Build the demo in the container
        run: |
          mkdir -p out
          docker run --rm --network none -u "$(id -u):$(id -g)" \
            -v "$PWD/examples/DemoForm:/src:ro" -v "$PWD/out:/out" \
            mono-roslyn /src -o /out/DemoForm

      - name: Check the build is deterministic
        run: |
          docker run --rm --network none -u "$(id -u):$(id -g)" \
            -v "$PWD/examples/DemoForm:/src:ro" -v "$PWD/out:/out" \
            mono-roslyn /src -o /out/again
          cmp out/DemoForm/DemoForm.exe out/again/DemoForm.exe
          sha256sum out/DemoForm/DemoForm.exe

      - uses: actions/upload-artifact@v7
        with:
          name: DemoForm-${{ runner.arch }}
          path: |
            out/DemoForm/DemoForm.exe
            out/DemoForm/DemoForm.exe.config

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
